name: Deploy Pipeline to Contabo VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Deployment on VPS..."
            
            # Directory where the pipeline is hosted
            TARGET_DIR="/root/career_automation"
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "📂 Cloning repository for the first time..."
              git clone https://github.com/Therook-sudo/Career_automation.git "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR"
            
            echo "📥 Pulling latest changes from main branch..."
            git reset --hard origin/main
            git pull origin main
            
            # Inject .env file from GitHub Secrets if provided
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              echo "${{ secrets.ENV_FILE }}" > .env
              echo "🔒 Injected production .env file"
            fi
            
            echo "🐳 Building and restarting Docker containers..."
            docker compose down --remove-orphans || true
            docker compose up -d --build
            
            echo "✅ Deployment Successful!"
            docker ps --filter "name=pipeline" --filter "name=n8n"
