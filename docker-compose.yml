version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_pipeline
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=n8n.therook.xyz
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.therook.xyz/
      - N8N_EDITOR_BASE_URL=https://n8n.therook.xyz/
    volumes:
      - n8n_data:/home/node/.n8n

  telegram_bot:
    build: .
    container_name: pipeline_bot
    restart: always
    env_file:
      - .env
    depends_on:
      - n8n

  web_dashboard:
    image: nginx:alpine
    container_name: pipeline_dashboard
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro

volumes:
  n8n_data:
